[project]
name = "langgraph-router-subagents-uuid"
version = "0.1.0"
description = "LangGraph router with deterministic UUIDv5 subagent thread IDs derived from a router thread ID."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60",
    "langchain-core>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
